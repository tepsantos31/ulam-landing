<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Email confirmed — UlamHub</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" sizes="32x32" href="../../assets/icons/favicon-32.png">
<link rel="apple-touch-icon" href="../../assets/icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../styles.css">
<style>
  .confirm-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .confirm-card { max-width: 420px; width: 100%; background: var(--white); border-radius: var(--r-xxl); padding: 48px 36px; text-align: center; box-shadow: 0 20px 50px rgba(35,51,28,0.12); }
  .confirm-logo { width: 56px; height: 56px; border-radius: var(--r-md); margin: 0 auto 20px; display: block; }
  .confirm-card h1 { font-size: 24px; margin-bottom: 12px; }
  .confirm-card p { font-size: 15px; color: var(--sage-text); line-height: 1.6; margin-bottom: 28px; }
</style>
</head>
<body style="background: var(--cream);">

<main class="confirm-wrap">
  <div class="confirm-card">
    <img class="confirm-logo" src="../../assets/icons/email-logo.png" alt="" width="56" height="56">
    <h1>Your email is confirmed</h1>
    <p>You're all set — head back to the UlamHub app and sign in.</p>
    <a class="btn btn-primary" href="https://www.ulamhub.com">Visit UlamHub.com</a>
  </div>
</main>

</body>
</html>
